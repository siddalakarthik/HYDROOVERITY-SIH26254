<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">HYDROOVERITY evidence and service workflow</title>
<desc id="desc">Qualified hydraulic, five-channel wetness and common-clock acoustic evidence inform authorized triage. Resident concerns remain distinct from measured evidence. Authorized work leads to independent review, supported outcomes or NOT_VERIFIABLE.</desc>
