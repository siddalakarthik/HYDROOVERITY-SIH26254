<text x="275.0" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#16384b">Resident concern</text>
<text x="275.0" y="459" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#16384b">Not automatically an incident</text>
<rect x="555" y="390" width="490" height="90" rx="12" fill="#123e50" stroke="#98b4c2" stroke-width="2"/>
<text x="800.0" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="white">Authorized triage</text>
<text x="800.0" y="459" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="white">Incident and work authorization</text>
