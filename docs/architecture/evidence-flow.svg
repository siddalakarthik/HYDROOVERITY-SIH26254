<text x="1330.0" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#16384b">HYDRO-EAR / EAR-PAIR</text>
<text x="1330.0" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#16384b">Two pickups, one ADC clock</text>
<rect x="555" y="245" width="490" height="90" rx="12" fill="#123e50" stroke="#98b4c2" stroke-width="2"/>
