<text x="800.0" y="571" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#16384b">Investigation findings or genuine repair record</text>
<text x="800.0" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#16384b">Work completion is not proof of effectiveness</text>
